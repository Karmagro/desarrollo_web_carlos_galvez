<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas</title>
    <link rel="stylesheet" href="estadisticas.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="header">
        <h1>Estadísticas de Actividades</h1>
        <p>Visualización de datos sobre las actividades recreativas.</p>
    </div>

    <div class="chart-container">
        <section class="chart-section">
            <h2>Cantidad de Actividades por Día</h2>
            <canvas id="lineChart"></canvas>
        </section>

        <section class="chart-section">
            <h2>Total de actividades por tipo</h2>
            <canvas id="pieChart"></canvas>
        </section>

        <section class="chart-section">
            <h2>Actividades por Horario y Mes</h2>
            <canvas id="barChart"></canvas>
        </section>
    </div>

    <div class="volver">
        <button onclick="location.href='index.html'">Volver a la Portada</button>
    </div>

    <script>
        // Gráfico de líneas
        new Chart(document.getElementById('lineChart'), {
            type: 'line',
            data: {
                labels: ['2025-04-01', '2025-04-02', '2025-04-03', '2025-04-04'],
                datasets: [{
                    label: 'Actividades',
                    data: [3, 5, 2, 4],
                    borderColor: 'black',
                    backgroundColor: 'gray'
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        // Gráfico de torta
        new Chart(document.getElementById('pieChart'), {
            type: 'pie',
            data: {
                labels: ['Música', 'Deporte', 'Ciencias', 'Comida', 'Otro'],
                datasets: [{
                    data: [5, 3, 2, 4, 1],
                    backgroundColor: ['#000', '#555', '#999', '#ccc', '#eee']
                }]
            },
            options: {
                responsive: true
            }
        });

        // Gráfico de barras
        new Chart(document.getElementById('barChart'), {
            type: 'bar',
            data: {
                labels: ['Abril', 'Mayo', 'Junio'],
                datasets: [
                    {
                        label: 'Mañana',
                        data: [3, 2, 4],
                        backgroundColor: '#000'
                    },
                    {
                        label: 'Mediodía',
                        data: [2, 3, 3],
                        backgroundColor: '#999'
                    },
                    {
                        label: 'Tarde',
                        data: [1, 4, 2],
                        backgroundColor: '#ccc'
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>
</body>
</html>
