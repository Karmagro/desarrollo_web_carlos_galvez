<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="agregar-style.css">
    <title>Agregar Actividad</title>
</head>
<body>
    <header>
        <h1>Agregar Actividad</h1>
        <p>Por favor, complete el siguiente formulario para agregar una nueva actividad.</p>
    </header>
    <form id="form-actividad">
        <fieldset>
            <legend>¿Dónde?</legend>
            <label for="region">Región:</label>
            <select id="region" required>
                <option value="">...</option>
            </select><br>

            <label for="comuna">Comuna:</label>
            <select id="comuna" required>
                <option value="">...</option>
            </select><br>

            <label for="sector">Sector:</label>
            <input type="text" id="sector" maxlength="100"><br>
        </fieldset>

        <fieldset>
            <legend>¿Quién organiza?</legend>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" maxlength="200" required><br>

            <label for="email">Email:</label>
            <input type="email" id="email" maxlength="100" required><br>

            <label for="telefono">Número de celular:</label>
            <input type="tel" id="telefono"><br>

            <label style="display:block;">Contactar por:</label>
            <div class="checkbox-group">
                <label for="whatsapp">Whatsapp</label>
                <input id="whatsapp" type="checkbox" name="contacto" onclick="revisaCheck(this);">
                <input id="whatsapp-id" type="text" placeholder="ID de Whatsapp" disabled><br>

                <label for="instagram">Instagram</label>
                <input id="instagram" type="checkbox" name="contacto" onclick="revisaCheck(this);">
                <input id="instagram-id" type="text" placeholder="ID de Instagram" disabled><br>

                <label for="telegram">Telegram</label>
                <input id="telegram" type="checkbox" name="contacto" onclick="revisaCheck(this);">
                <input id="telegram-id" type="text" placeholder="ID de Telegram" disabled><br>

                <label for="x">X/Twitter</label>
                <input id="x" type="checkbox" name="contacto" onclick="revisaCheck(this);">
                <input id="x-id" type="text" placeholder="ID de X/Twitter" disabled><br>
            </div>
        </fieldset>

        <fieldset>
            <legend>¿Cuándo y de qué trata?</legend>
            <label for="inicio">Día hora inicio :</label>
            <input type="datetime-local" id="inicio" required><br>

            <label for="termino">Día hora término:</label>
            <input type="datetime-local" id="termino"><br>

            <label for="descripcion">Descripción:</label>
            <textarea id="descripcion" style="display:block;" rows="10" cols="50"></textarea>

            <label for="tema">Tema:</label>
            <select id="tema" required>
                <option value="">Seleccione...</option>
                <option value="musica">Música</option>
                <option value="deporte">Deporte</option>
                <option value="ciencias">Ciencias</option>
                <option value="religion">Religión</option>
                <option value="politica">Política</option>
                <option value="juegos">Juegos</option>
                <option value="baile">Baile</option>
                <option value="comida">Comida</option>
                <option value="otro">Otro</option>
            </select>
            <input type="text" id="tema-otro" placeholder="Especifique el tema" style="display: none;"><br>

            <label>Fotos:</label>
            <div id="foto-container">
                <input type="file" id="foto1" accept="image/*"><br>
            </div>
            <button type="button" onclick="agregarFoto();">Agregar otra foto</button><br>

            <button type="submit">Agregar esta actividad</button>
            <button type="button" onclick="location.href='index.html'">Cancelar</button>
        </fieldset>
    </form>
    <script src="region_comuna.js"></script>
    <script src="script.js"></script>
</body>
</html>
